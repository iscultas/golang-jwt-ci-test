version: "2"

linters:
  default: standard

  enable:
    - bodyclose
    - canonicalheader
    - noctx
    - nosprintfhostport
    - errchkjson
    - musttag
    - asasalint
    - containedctx
    - copyloopvar
    - durationcheck
    - errorlint
    - exptostd
    - fatcontext
    - forcetypeassert
    - gocheckcompilerdirectives
    - intrange
    - iotamixing
    - mirror
    - modernize
    - nilnesserr
    - perfsprint
    - reassign
    - recvcheck
    - unconvert
    - unparam
    - usestdlibvars
    - wastedassign
    - asciicheck
    - bidichk
    - dupword
    - godot
    - godoclint
    - godox
    - misspell
    - predeclared
    - revive
    - whitespace
    - decorder
    - dogsled
    - embeddedstructfieldcheck
    - iface
    - interfacebloat
    - nakedret
    - testableexamples
    - testpackage
    - thelper
    - tparallel
    - usetesting
    - gosec
    - nolintlint

  settings:
    revive:
      rules:
        - name: var-naming
        - name: var-declaration

    thelper:
      tb:
        name: false

    dupword:
      ignore:
        - X25519
        - X448

    godot:
      exclude:
        - '"$'

    recvcheck:
      exclusions:
        - "*.MarshalJSONTo"
        - "*.UnmarshalJSONFrom"

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - forcetypeassert
          - gosec

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: false

formatters:
  enable:
    - gofumpt
    - gci

  settings:
    gci:
      sections:
        - standard
        - default
